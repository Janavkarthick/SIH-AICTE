name: AICTE-Verify CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker-test-and-evaluate:
    name: Build Docker & Run Forensics Evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker compose services
        run: |
          cd aicte-verify
          docker compose build backend

      - name: Run Pytest test suite inside backend container
        run: |
          cd aicte-verify
          docker compose run --rm backend pytest tests/ -v

      - name: Run benchmark evaluation inside backend container
        run: |
          cd aicte-verify
          docker compose run --rm backend python scripts/evaluate.py

      - name: Upload Docker Evaluation Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-evaluation-report
          path: |
            aicte-verify/docs/EVAL.md
            aicte-verify/data/synthetic/evaluation_results.json
